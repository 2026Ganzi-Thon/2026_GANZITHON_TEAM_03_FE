name: 버그 수정
description: 고쳐야 할 오류
title: "fix: "
labels: ["fix"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 어떤 문제인가요?
      placeholder: 예) 치즈 카드를 누르면 화면이 하얗게 변한다
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 어떻게 하면 생기나요?
      placeholder: |
        1. 홈 화면 진입
        2. 치즈 카드 클릭
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 원래는 어떻게 돼야 하나요? (선택)
      placeholder: 예) 치즈 상세 화면으로 이동해야 한다
