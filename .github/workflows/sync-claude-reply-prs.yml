name: claude-reply PR 브랜치 develop 동기화

# develop 에 새 코드가 들어오면, claude-reply 라벨이 붙은 열린 PR(base: develop)의 브랜치에
# develop 을 merge 해서 Claude 가 항상 최신 develop 기준으로 답하게 한다.
# 충돌이 나면 develop 쪽 내용으로 자동 해결한다(develop 이 기준). 댓글은 남기지 않는다.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: sync-claude-reply-prs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: develop 을 claude-reply PR 브랜치에 merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh pr list --base develop --label claude-reply --state open \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"' |
          while read -r number branch; do
            echo "::group::#$number $branch"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            # 충돌 구간은 develop 쪽(-X theirs)으로, 그래도 남는 충돌 파일은 develop 버전으로 맞춘다
            if ! git merge --no-edit -X theirs -m "chore: develop 변경사항 반영 (자동 동기화)" origin/develop; then
              git diff --name-only --diff-filter=U | while read -r f; do
                git checkout --theirs -- "$f" 2>/dev/null && git add -- "$f" || git rm -q -- "$f"
              done
              git -c core.editor=true commit --no-edit
            fi
            git push origin "$branch"
            echo "::endgroup::"
          done
