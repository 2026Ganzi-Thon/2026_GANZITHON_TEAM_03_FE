<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 폴리의 섬 앱 아이콘: 주색(color-primary #59603b) 바탕에 웃는 양. 그림은 가운데 80% 안에 둬서 maskable 로 잘려도 안전하다 -->
  <rect width="512" height="512" rx="112" fill="#59603b" />

  <!-- 다리 -->
  <g fill="#f2dcc0">
    <rect x="212" y="392" width="32" height="54" rx="14" />
    <rect x="268" y="392" width="32" height="54" rx="14" />
  </g>
  <g fill="#8a7a63">
    <path d="M212 430h32v2a14 14 0 0 1-14 14h-4a14 14 0 0 1-14-14z" />
    <path d="M268 430h32v2a14 14 0 0 1-14 14h-4a14 14 0 0 1-14-14z" />
  </g>

  <!-- 몽실몽실한 털 -->
  <g fill="#fffcf5">
    <circle cx="256" cy="282" r="122" />
    <circle cx="256" cy="158" r="62" />
    <circle cx="184" cy="180" r="58" />
    <circle cx="328" cy="180" r="58" />
    <circle cx="138" cy="252" r="56" />
    <circle cx="374" cy="252" r="56" />
    <circle cx="162" cy="334" r="56" />
    <circle cx="350" cy="334" r="56" />
    <circle cx="218" cy="378" r="52" />
    <circle cx="294" cy="378" r="52" />
  </g>

  <!-- 귀 -->
  <g>
    <ellipse cx="166" cy="262" rx="40" ry="23" transform="rotate(24 166 262)" fill="#f2dcc0" />
    <ellipse cx="164" cy="263" rx="24" ry="11" transform="rotate(24 164 263)" fill="#eab8a3" />
    <ellipse cx="346" cy="262" rx="40" ry="23" transform="rotate(-24 346 262)" fill="#f2dcc0" />
    <ellipse cx="348" cy="263" rx="24" ry="11" transform="rotate(-24 348 263)" fill="#eab8a3" />
  </g>

  <!-- 얼굴 -->
  <ellipse cx="256" cy="286" rx="84" ry="76" fill="#f7e6cf" />

  <!-- 앞머리 털 -->
  <g fill="#fffcf5">
    <circle cx="218" cy="222" r="32" />
    <circle cx="256" cy="210" r="36" />
    <circle cx="294" cy="222" r="32" />
  </g>

  <!-- 볼 -->
  <g fill="#eab8a3" opacity="0.75">
    <circle cx="200" cy="312" r="14" />
    <circle cx="312" cy="312" r="14" />
  </g>

  <!-- 웃는 눈, 입 -->
  <g fill="none" stroke="#4f4636" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 284q16-18 32 0" />
    <path d="M274 284q16-18 32 0" />
    <path d="M238 320q9 12 18 0q9 12 18 0" />
  </g>
</svg>
